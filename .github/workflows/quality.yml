name: Repository quality

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install repository check tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check tracked files
        run: python -m pre_commit run --all-files --show-diff-on-failure
  git-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test Git policy behavior
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Check branch, PR route and commit headers
        run: python scripts/check_git_policy.py ci

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_DB: yeonieum_test
          POSTGRES_USER: yeonieum_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U yeonieum_test -d yeonieum_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements-lock.txt
      - run: python -m pip install -r apps/api/requirements-lock.txt
      - run: python -m ruff check apps/api
      - run: python -m ruff format --check apps/api
      - run: python -m pytest apps/api -q
        env:
          YEONIEUM_TEST_POSTGRES_URL: postgresql://yeonieum_test:ci-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/yeonieum_test
  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements-lock.txt
      - run: python -m pip install -r apps/api/requirements-lock.txt
      - run: npm ci
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
