name: Repository quality

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install repository check tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check tracked files
        run: python -m pre_commit run --all-files --show-diff-on-failure
  git-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test Git policy behavior
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Check branch, PR route and commit headers
        run: python scripts/check_git_policy.py ci
